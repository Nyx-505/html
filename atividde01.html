<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link opcional do Bootstrap para fazer o alerta funcionar visualmente -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <title>Desenvolvendo - Amor na Arte</title>
</head>
<body>

    <header class="container my-4">
        <h1 class="display-4 text-center">Amor na Arte</h1>
        
        <!-- Correção: A div de alerta agora envolve a estrutura corretamente -->
        <div class="alert alert-primary text-center" role="alert">
            O <strong>amor</strong> expresso através da <span class="badge bg-secondary">Arte</span>
        </div>
    </header>

    <main class="container">
        <section class="mb-4">
            <!-- Mudado de "Introdução ao HTML" para o tema real da sua página -->
            <h2>A Expressão do Amor na Arte</h2>
            
            <!-- Correção: Ajustado o fechamento da tag <em> que estava como </em> antes de abrir -->
            <p>
                O amor na arte é a representação de um dos sentimentos mais profundos da humanidade através de 
                <em>pinturas</em>, <em>esculturas</em> e <em>poesias</em>.
            </p>
        </section>
    </main>

    <footer class="text-center py-3 border-top">
        <p>&copy; Any Rodrigues Santos</p>
    </footer>

</body>
</html>
