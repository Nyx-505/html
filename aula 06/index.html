<body>
<!-- a semantica no html significa usar tags ertas para cada tipo de coteudo, ajudando navegadores,
 mecanismos em busca de leitores de tela a entenderem melhor a estura da pagina-->

 <!-- beneficios do html semantico -->
  <!-- 
  melhor a acessibilidade  (leitores de tela conseguem interpretar  melhor)
  facilita a manuteção do codigo. Codigo mais organizado e legivel
  melhora o SEO 
  ajuda a esponsividade -->

</head>
<body>
<!----------------------------------->
Sem semantica 
<a href="#">Sobre</a>
<p> texto principal do site </p>
<!-- HTML semântico-->


<header>
<nav>
 <a href="">inicio</a>
    <a href="">sobre</a>
</nav>
</header>

<main>
    <p> texto principal do site</p>
    </main>
 
    <section>
     <!----agrupar conteúdos que têm uma relação temática entre si dentro de uma página web--->

     <h2>Últimas Noticias</h2>
     <p>hoje foi anunciado um novo projeto...</p>

     <article>
        <!--O termo article pode referir-se ao conceito gramatical de artigo
         (como a, an, the em inglês) ou a um artigo acadêmico/jornalístico.-->
         <h3> flores.....</h3>
         <p> amor....</p>
     </article>
    </section>
</main>
<footer>

    <main> 
        <aside>
            <!---tag  é usada para identificar conteúdos que estão indiretamente relacionados ao texto
             principal da página.
             Eles funcionam como informações complementares, barras laterais ou notas de rodapé -->
        </aside>
    </main>
